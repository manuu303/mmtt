<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziyarat Tours — Moon Mohsin Travels and Tours</title>
<meta name="description" content="Guided Ziyarat tours across Makkah, Madinah, Iran and Iraq with hotels and transport arranged.">
<link rel="icon" type="image/png" href="assets/images/ChatGPT%20Image%20Sep%2026,%202026,%2011_28_20%20PM.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="chrome-navbar"></div>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb-custom mb-2"><a href="index.html">Home</a> / Ziyarat</div>
    <h1>Ziyarat Tours</h1>
    <p>Guided visits across Makkah, Madinah, and dedicated Iran &amp; Iraq Ziyarat tours.</p>
  </div>
</header>

<section>
  <div class="container">
    <div class="gallery-filter text-center mb-3" id="ziyaratFilters"></div>
    <div class="row g-4" id="ziyaratAllCards"></div>
  </div>
</section>

<section class="text-center bg-white">
  <div class="container">
    <h2>Planning an Iran or Iraq Ziyarat group?</h2>
    <p style="max-width:520px; margin:0 auto 1.5rem;">Group departures fill up early — reach out for the current schedule and seat availability.</p>
    <a class="btn btn-whatsapp btn-lg" target="_blank" rel="noopener" id="ctaWhatsapp"><i class="bi bi-whatsapp me-2"></i>Check Availability</a>
  </div>
</section>

<div id="chrome-footer"></div>

<div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailsModalLabel"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailsModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js?v=20260927-details"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const regions = ["All", ...new Set(SITE_CONFIG.ziyaratPackages.map(p => p.region))];
    const filterEl = document.getElementById("ziyaratFilters");
    filterEl.innerHTML = regions.map((r,i) => `<button class="btn ${i===0?'btn-ink':'btn-outline-ink'} btn-sm" data-region="${r}">${r}</button>`).join("");
    function apply(region) {
      const items = region === "All" ? SITE_CONFIG.ziyaratPackages : SITE_CONFIG.ziyaratPackages.filter(p => p.region === region);
      renderZiyaratCards("ziyaratAllCards", items);
    }
    filterEl.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      filterEl.querySelectorAll("button").forEach(b => b.classList.replace("btn-ink","btn-outline-ink"));
      btn.classList.replace("btn-outline-ink","btn-ink");
      apply(btn.dataset.region);
    }));
    apply("All");
    document.getElementById("ctaWhatsapp").href = waLink("Hello, I'd like the current Iran/Iraq Ziyarat group schedule.");
  });
</script>
</body>
</html>
