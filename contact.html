<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — Moon Mohsin Travels and Tours</title>
<meta name="description" content="Get in touch with Moon Mohsin Travels and Tours by phone, WhatsApp, email or at our office — or request a quote directly.">
<link rel="icon" type="image/png" href="assets/images/ChatGPT%20Image%20Sep%2026,%202026,%2011_28_20%20PM.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="chrome-navbar"></div>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb-custom mb-2"><a href="index.html">Home</a> / Contact Us</div>
    <h1>Contact Us</h1>
    <p>Reach us however's easiest — WhatsApp is usually the fastest.</p>
  </div>
</header>

<section>
  <div class="container">
    <div class="row g-4" id="contactCards"></div>
  </div>
</section>

<section class="bg-white">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-6">
        <div class="form-panel" id="quote">
          <span class="section-label">Request a Quote</span>
          <h2 class="h3 mb-3">Send us your travel details</h2>
          <form id="contactForm" class="row g-3 needs-validation" novalidate>
            <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Phone Number</label><input type="tel" name="phone" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">WhatsApp Number</label><input type="tel" name="whatsapp" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
            <div class="col-md-6">
              <label class="form-label">Travel Type</label>
              <select name="travelType" class="form-select" required>
                <option value="" disabled selected>Select</option>
                <option>Umrah</option><option>Ziyarat</option><option>Tour Package</option>
                <option>Flight / Ticket</option><option>Visa Services</option><option>Custom Tour</option><option>Other</option>
              </select>
            </div>
            <div class="col-md-6"><label class="form-label">Departure City</label><input type="text" name="departureCity" class="form-control"></div>
            <div class="col-12"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="3"></textarea></div>
            <div class="col-12 d-flex align-items-center gap-3">
              <button type="submit" class="btn btn-gold">Request a Quote</button>
              <span class="text-muted small">Opens WhatsApp with your details pre-filled</span>
            </div>
            <div class="col-12"><div class="form-success d-none">Thanks — check WhatsApp to send your message.</div></div>
          </form>
        </div>
      </div>
      <div class="col-lg-6">
        <span class="section-label">Our Office</span>
        <h2 class="h3 mb-3">Visit or write to us</h2>
        <div class="img-placeholder-wrap mb-3" style="aspect-ratio:16/10;">
          <iframe id="officeMap" title="Map to Moon Mohsin Travels and Tours" class="w-100 h-100 border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="chrome-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js?v=20260927-details"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const c = SITE_CONFIG.company;
    document.getElementById("officeMap").src = c.mapEmbedUrl;
    document.getElementById("contactCards").innerHTML = `
      <div class="col-md-6 col-lg-3"><div class="service-card text-center"><div class="service-card__icon mx-auto"><i class="bi bi-telephone-fill"></i></div><h3>Call Us</h3>${c.phoneNumbers.map(phone => `<p class="mb-1"><a href="${phone.link}">${phone.display}</a></p>`).join("")}</div></div>
      <div class="col-md-6 col-lg-3"><div class="service-card text-center"><div class="service-card__icon mx-auto"><i class="bi bi-whatsapp"></i></div><h3>WhatsApp</h3><p><a href="${waLink()}" target="_blank" rel="noopener">${c.whatsappDisplay}</a></p><p><a href="${c.whatsappChannel}" target="_blank" rel="noopener">Follow our channel</a></p></div></div>
      <div class="col-md-6 col-lg-3"><div class="service-card text-center"><div class="service-card__icon mx-auto"><i class="bi bi-envelope-fill"></i></div><h3>Email</h3><p><a href="mailto:${c.email}">${c.email}</a></p></div></div>
      <div class="col-md-6 col-lg-3"><div class="service-card text-center"><div class="service-card__icon mx-auto"><i class="bi bi-geo-alt-fill"></i></div><h3>Office</h3><p>${c.address}</p></div></div>`;

    wireInquiryForm("contactForm", d => `Hello, I'd like a quote.\nName: ${d.name}\nPhone: ${d.phone}\nWhatsApp: ${d.whatsapp||"-"}\nEmail: ${d.email||"-"}\nTravel type: ${d.travelType}\nDeparture city: ${d.departureCity||"-"}\nMessage: ${d.message||"-"}`);
  });
</script>
</body>
</html>
