<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Packages — Moon Mohsin Travels and Tours</title>
<meta name="description" content="International, domestic, family, honeymoon, group and customized tour packages.">
<link rel="icon" type="image/png" href="assets/images/ChatGPT%20Image%20Sep%2026,%202026,%2011_28_20%20PM.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="chrome-navbar"></div>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb-custom mb-2"><a href="index.html">Home</a> / Packages</div>
    <h1>Explore Our Packages</h1>
    <p>International, domestic, family, honeymoon, group and fully customized tours.</p>
  </div>
</header>

<section>
  <div class="container">
    <div class="row g-3 align-items-center mb-4">
      <div class="col-md-6">
        <input type="search" id="packageSearch" class="form-control" placeholder="Search by destination or package name...">
      </div>
      <div class="col-md-6">
        <div class="gallery-filter text-md-end" id="categoryFilters"></div>
      </div>
    </div>
    <div class="row g-4" id="tourAllCards"></div>
  </div>
</section>

<section class="text-center bg-white">
  <div class="container">
    <h2>Don't see the trip you're after?</h2>
    <p style="max-width:520px; margin:0 auto 1.5rem;">Tell us your destination, dates and budget — we'll build a custom itinerary around it.</p>
    <a href="contact.html#quote" class="btn btn-gold btn-lg">Request a Custom Itinerary</a>
  </div>
</section>

<div id="chrome-footer"></div>

<div class="modal" id="detailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailsModalLabel"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailsModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js?v=20260927-details"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cats = ["All", ...new Set(SITE_CONFIG.tourPackages.map(p => p.category))];
    const filterEl = document.getElementById("categoryFilters");
    filterEl.innerHTML = cats.map((c,i) => `<button class="btn ${i===0?'btn-ink':'btn-outline-ink'} btn-sm" data-cat="${c}">${c}</button>`).join("");

    let activeCat = "All";
    function apply() {
      const q = document.getElementById("packageSearch").value.trim().toLowerCase();
      let items = activeCat === "All" ? SITE_CONFIG.tourPackages : SITE_CONFIG.tourPackages.filter(p => p.category === activeCat);
      if (q) items = items.filter(p => (p.destination + p.title).toLowerCase().includes(q));
      renderTourCards("tourAllCards", items);
    }
    filterEl.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      filterEl.querySelectorAll("button").forEach(b => b.classList.replace("btn-ink","btn-outline-ink"));
      btn.classList.replace("btn-outline-ink","btn-ink");
      activeCat = btn.dataset.cat;
      apply();
    }));
    document.getElementById("packageSearch").addEventListener("input", apply);
    apply();
  });
</script>
</body>
</html>
